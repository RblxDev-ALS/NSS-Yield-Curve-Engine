[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "nss-engine"
version = "2.5.0"
description = "U.S. Treasury yield curve engine: Nelson-Siegel-Svensson fits since 1990, a survey-anchored term premium, breakeven inflation, recession signals and forecasts, all tested out of sample."
dynamic = ["readme"]
# your name as it should appear on PyPI; keep it the same as in CITATION.cff and
# website/build.py (AUTHOR) - tests/test_examples.py checks that they agree
authors = [{ name = "Musa Jafri" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["yield curve", "nelson-siegel", "svensson", "fixed income", "term structure", "term premium", "breakeven inflation", "quantitative finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.10",
    "plotly>=5.18",
]

[project.optional-dependencies]
surveys = [
    "openpyxl>=3.1",  # reads the Philadelphia Fed's Survey of Professional Forecasters files
    "xlrd>=2.0",  # reads the New York Fed's ACM term premium workbook (.xls)
]
figures = [
    "matplotlib>=3.7",  # static PNG charts (nss-engine run --figures)
]
dev = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "mypy>=1.8",
    "tabulate>=0.9",  # DataFrame.to_markdown in benchmarks/
    "markdown>=3.5",  # website/build.py
]

[project.scripts]
nss-engine = "nss_engine.cli:main"

[project.urls]
Repository = "https://github.com/RblxDev-ALS/NSS-Yield-Curve-Engine"
Homepage = "https://rblxdev-als.github.io/NSS-Yield-Curve-Engine/"
Documentation = "https://github.com/RblxDev-ALS/NSS-Yield-Curve-Engine/blob/main/docs/methodology.md"
Changelog = "https://github.com/RblxDev-ALS/NSS-Yield-Curve-Engine/blob/main/CHANGELOG.md"
Issues = "https://github.com/RblxDev-ALS/NSS-Yield-Curve-Engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nss_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE"]

# PyPI shows README.md without the repository around it: point relative links
# at GitHub and relative images at their raw files.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/RblxDev-ALS/NSS-Yield-Curve-Engine/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/RblxDev-ALS/NSS-Yield-Curve-Engine/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test requires internet access to FRED (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "PD", "RUF"]
ignore = [
    "E501",   # line length is handled by `ruff format`; long strings are allowed
    "N803",   # argument names like `X` / `tau` follow math notation
    "N806",   # variable names like `X`, `A` follow math notation
    "RUF001", # typographic minus signs / Greek letters in labels are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["src/nss_engine"]
