# Publishes nss-engine to PyPI when a version tag (v2.3.0, ...) is pushed.
#
# Uses PyPI "trusted publishing": no API token is stored anywhere. PyPI trusts
# this workflow file in this repository, running in the `pypi` environment.
# One-time setup is described in docs/releasing.md.
#
# A push or pull request that changes packaging only builds and checks the
# distributions (the `build` job); only a version tag publishes.
name: Release

on:
  push:
    tags: ["v*"] # path filters are not applied to tags: every version tag runs
    branches: ["**"]
    paths: ["pyproject.toml", "README.md", "src/nss_engine/__init__.py", ".github/workflows/release.yml"]
  pull_request:
    paths: ["pyproject.toml", "README.md", "src/nss_engine/__init__.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/nss-engine --version
          /tmp/smoke/bin/python -c "import nss_engine, numpy as np; c = nss_engine.NSSCurve(4.5, -1.5, -2, 1, 0.9, 0.15); f = nss_engine.calibrate(np.array([0.25, 1, 2, 5, 10, 30]), c.par_yield([0.25, 1, 2, 5, 10, 30])); assert f.rmse_bp < 0.1; print(nss_engine.__version__, 'ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nss-engine
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1 }
            found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
