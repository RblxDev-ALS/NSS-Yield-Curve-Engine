# Publishes nss-engine to PyPI, either
#   * from the Actions tab: Release -> Run workflow on main, with "publish" ticked
#     (tags the commit v<version> from pyproject.toml), or
#   * when a version tag (v2.5.0, ...) is pushed.
#
# Uses PyPI "trusted publishing": no API token is stored anywhere. PyPI trusts
# this workflow file in this repository, running in the `pypi` environment.
# One-time setup is described in docs/releasing.md.
#
# A push or pull request that changes packaging only builds and checks the
# distributions (the `build` job).
name: Release

on:
  push:
    tags: ["v*"] # path filters are not applied to tags: every version tag runs
    branches: ["**"]
    paths: ["pyproject.toml", "README.md", "src/nss_engine/__init__.py", ".github/workflows/release.yml"]
  pull_request:
    paths: ["pyproject.toml", "README.md", "src/nss_engine/__init__.py", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in pyproject.toml to PyPI and tag it (main only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
          if [ "${PUBLISH}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::publish from main only (this run is on ${GITHUB_REF_NAME})"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
              echo "::error::v${version} is already released; bump the version first (docs/releasing.md)"
              exit 1
            fi
          fi
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/nss-engine --version
          /tmp/smoke/bin/python -c "import nss_engine, numpy as np; t = np.array([0.25, 0.5, 1, 2, 3, 5, 7, 10, 20, 30]); c = nss_engine.NSSCurve(4.5, -1.5, -2, 1, 0.9, 0.15); f = nss_engine.calibrate(t, c.par_yield(t)); assert f.rmse_bp < 0.1, f.rmse_bp; print(nss_engine.__version__, 'ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nss-engine
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${VERSION}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1 }
            found' CHANGELOG.md > notes.md
          # creates the tag on this commit when the run was started from the Actions tab
          gh release create "v${version}" dist/* --target "$GITHUB_SHA" --title "v${version}" --notes-file notes.md
