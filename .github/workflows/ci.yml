name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests benchmarks examples
      - name: Ruff (format)
        run: ruff format --check src tests benchmarks examples
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov=nss_engine --cov-report=term-missing

  test-windows:
    # Windows uses a legacy default text encoding (cp1252) and backslash paths;
    # run the suite there once so platform-specific bugs show up in CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: CLI end to end (synthetic market, writes the report and dashboard)
        run: nss-engine run --source synthetic --out out --no-forecast
