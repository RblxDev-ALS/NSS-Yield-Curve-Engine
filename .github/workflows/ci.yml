name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check nsscurve tests benchmarks nss_engine.py
      - name: Test
        run: pytest -q
      - name: Offline smoke run
        run: python nss_engine.py --offline --years 2 --no-backtest --output-dir output --quiet
