# Temporary: discover the layout of the Survey of Professional Forecasters files.
name: Probe SPF

on:
  push:
    branches: [claude/epic-tesla-l4y8e9]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl xlrd
      - name: Probe
        shell: python
        run: |
          import io, re, urllib.request
          import pandas as pd
          UA = {"User-Agent": "Mozilla/5.0 (nss-engine probe)"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                      return r.status, r.read(), r.headers.get("Content-Type")
              except Exception as e:
                  return repr(e), b"", None
          pages = [
              "https://www.philadelphiafed.org/surveys-and-data/tbill",
              "https://www.philadelphiafed.org/surveys-and-data/bill10",
              "https://www.philadelphiafed.org/surveys-and-data/real-time-data-research/survey-of-professional-forecasters",
              "https://www.philadelphiafed.org/surveys-and-data/real-time-data-research/spf-historical-data",
              "https://www.philadelphiafed.org/surveys-and-data/data-files",
          ]
          links = set()
          for p in pages:
              st, body, ct = get(p)
              print("PAGE", p, st, ct, len(body))
              for m in re.findall(r'href="([^"]+\.(?:xlsx|xls|csv|txt))"', body.decode("utf-8", "ignore"), re.I):
                  links.add(m)
          for l in sorted(links):
              print("LINK", l)
          base = "https://www.philadelphiafed.org/-/media/frbp/assets/surveys-and-data/survey-of-professional-forecasters/"
          cands = [base + s for s in [
              "historical-data/medianlevel.xlsx", "historical-data/meanlevel.xlsx",
              "data-files/files/median_tbill_level.xlsx", "data-files/files/Median_TBILL_Level.xlsx",
              "data-files/files/median_bill10_level.xlsx", "data-files/files/Median_BILL10_Level.xlsx",
              "data-files/files/mean_tbill_level.xlsx", "data-files/files/Mean_BILL10_Level.xlsx",
          ]]
          cands += ["https://www.philadelphiafed.org" + l if l.startswith("/") else l
                    for l in sorted(links) if re.search(r"tbill|bill10|median|mean", l, re.I)]
          seen = set()
          for u in cands:
              if u in seen:
                  continue
              seen.add(u)
              st, body, ct = get(u)
              print("\nURL", u, st, ct, len(body))
              if not body:
                  continue
              try:
                  xl = pd.ExcelFile(io.BytesIO(body))
                  print("  sheets:", xl.sheet_names[:80])
                  for sh in xl.sheet_names:
                      if re.search(r"tbill|bill10", sh, re.I) or len(xl.sheet_names) == 1:
                          df = xl.parse(sh)
                          print("  --", sh, df.shape)
                          print(df.head(3).to_string())
                          print(df.tail(3).to_string())
              except Exception as e:
                  print("  not excel:", e, body[:300])
          for u in ["https://rblxdev-als.github.io/NSS-Yield-Curve-Engine/",
                    "https://rblxdev-als.github.io/NSS-Yield-Curve-Engine/badges/regime.json"]:
              print("PAGES", u, get(u)[0])
